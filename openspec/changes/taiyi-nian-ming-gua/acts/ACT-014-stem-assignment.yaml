notes: |
  否卦原文序列: 戊→壬→丙→壬→戊→甲
  泰卦原文序列: 庚→丙→壬→丙→庚→甲
  算法需精确复现。如果简单的 "i==3不推进" 无法匹配，可能需要
  "i==3时 cursor 回退1步"。请根据实际验证调整实现。
