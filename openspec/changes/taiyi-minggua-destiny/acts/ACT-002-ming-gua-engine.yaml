CONTEXT:
  DOMAIN: "太乙命卦 · 核心计算引擎(统运入卦四步:积年→定卦→定动爻→变卦)"
  STRATEGY: "accYear=year+epochBase;remainder=accYear%64;guaIndex=(remainder==0)?64:remainder;benGua=guaSequence[guaIndex-1]。阴阳辰:ganZhiIndex=(accYear-1)%60,偶=阳辰。动爻:yaoNum=(remainder==0)?64:remainder;阳辰position=((yaoNum-1)%6)+1(初爻向上);阴辰position=6-((yaoNum-1)%6)(上爻向下)。变卦:翻转动爻位的阴阳。纯函数无IO。"
